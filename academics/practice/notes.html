<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes</title>
<link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; background: #ffffff; color: #111111; line-height: 1.7; font-size: 15px; }
a { color: #111111; text-decoration: none; border-bottom: 1px solid #cccccc; }
a:hover { border-bottom-color: #111111; }
.nav { padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid #e0e0e0; font-size: 0.88rem; color: #888888; }
.nav a { color: #111111; }
.nav .sep { color: #cccccc; margin: 0 6px; }
h1 { font-size: 1.6rem; margin-bottom: 4px; }
h2 { font-size: 1.1rem; font-weight: 700; margin: 28px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #111111; }
h3 { font-size: 0.98rem; font-weight: 700; margin: 16px 0 4px; }
p, li { margin-bottom: 6px; color: #111111; }
.muted { color: #888888; font-size: 0.85rem; }
.subtitle { color: #555555; font-size: 0.95rem; margin-bottom: 20px; }
.box { border: 1px solid #111111; padding: 14px 18px; margin: 12px 0; }
.box-dashed { border: 1px dashed #888888; padding: 14px 18px; margin: 12px 0; }
.footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid #e0e0e0; color: #888888; font-size: 0.82rem; }
.v-badge { display: inline-block; border: 1px solid #111111; padding: 0 6px; font-size: 0.7rem; font-weight: 700; }
.btn { display: inline-block; padding: 6px 14px; border: 1px solid #111; background: #fff; color: #111; font-family: inherit; font-size: 0.85rem; cursor: pointer; margin-right: 6px; }
.btn:hover { background: #111; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }
.btn-primary { background: #111; color: #fff; }
.btn-primary:hover { background: #333; }
.btn-danger { border-color: #999; color: #999; }
.btn-danger:hover { background: #999; color: #fff; }

.subject-group { margin: 16px 0; }
.subject-header { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #111; cursor: pointer; }
.subject-header h3 { margin: 0; }
.subject-count { font-size: 0.82rem; color: #555; }
.subject-toggle { font-size: 1.2rem; transition: transform 0.2s; }
.subject-group.collapsed .subject-toggle { transform: rotate(-90deg); }
.subject-group.collapsed .notes-list { display: none; }

.notes-list { margin: 8px 0; }
.note-item { border: 1px solid #e0e0e0; padding: 12px 14px; margin: 8px 0; }
.note-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #888; margin-bottom: 6px; }
.note-qid { font-weight: 700; }
.note-text { font-size: 0.9rem; white-space: pre-wrap; }
.note-actions { margin-top: 8px; display: flex; gap: 4px; }

.highlight-item { border-left: 3px solid #111; padding: 8px 12px; margin: 6px 0; background: #fafafa; }
.highlight-qid { font-size: 0.78rem; color: #888; font-weight: 700; }
.highlight-text { font-size: 0.88rem; margin-top: 4px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
</style>
</head>
<body>

<div class="nav">
  <a href="../../../index.html">Home</a> <span class="sep">/</span>
  <a href="../../index.html">Academics</a> <span class="sep">/</span>
  <a href="../index.html">Practice</a> <span class="sep">/</span>
  Notes
</div>

<h1>Study Notes <span class="v-badge">v34</span></h1>
<p class="subtitle">学习笔记汇总 · 按科目分组 · 支持导出 JSON</p>

<div class="toolbar">
  <button class="btn btn-primary" onclick="exportNotes()">📥 导出笔记</button>
  <button class="btn" onclick="document.getElementById('importFile').click()">📤 导入笔记</button>
  <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importNotes(event)">
  <button class="btn btn-danger" onclick="clearAll()">🗑 清空所有</button>
</div>

<div id="notesContainer">
  <h2>📓 笔记汇总</h2>
  <div id="notesList"></div>
</div>

<div id="highlightsContainer">
  <h2>📌 高亮标注</h2>
  <div id="highlightsList"></div>
</div>

<div id="emptyState" style="display:none;">
  <div class="box-dashed">
    <p class="muted">暂无笔记。在做题页面点击"笔记"按钮即可添加学习笔记。</p>
  </div>
</div>

<div class="footer">
  <a href="../index.html">Practice Home</a>
</div>

<script src="../../js/notes.js"></script>
<script>
(function() {
  'use strict';

  var SUBJECT_NAMES = {
    toefl: 'TOEFL',
    ielts: 'IELTS',
    sat: 'SAT',
    ukmt: 'UKMT',
    amc: 'AMC',
    usabo: 'USABO',
    math: '数学',
    physics: '物理',
    chemistry: '化学',
    biology: '生物',
    english: '英语',
    history: '历史',
    geography: '地理',
    chinese: '语文',
    general: '通用'
  };

  function getSubjectName(s) {
    return SUBJECT_NAMES[s] || s;
  }

  function render() {
    var allSubjects = window.Notes.getAllSubjects();
    var hasNotes = Object.keys(allSubjects).length > 0;

    document.getElementById('emptyState').style.display = hasNotes ? 'none' : 'block';
    document.getElementById('notesContainer').style.display = hasNotes ? 'block' : 'none';

    var container = document.getElementById('notesList');
    container.innerHTML = '';

    Object.keys(allSubjects).sort().forEach(function(subject) {
      var notes = allSubjects[subject];
      var group = document.createElement('div');
      group.className = 'subject-group';
      group.id = 'group-' + subject;

      var header = document.createElement('div');
      header.className = 'subject-header';
      header.innerHTML = '<span class="subject-toggle">▼</span>' +
        '<h3>' + getSubjectName(subject) + '</h3>' +
        '<span class="subject-count">(' + notes.length + ' 条笔记)</span>';
      header.onclick = function() {
        group.classList.toggle('collapsed');
      };
      group.appendChild(header);

      var list = document.createElement('div');
      list.className = 'notes-list';

      notes.sort(function(a, b) { return b.updatedAt - a.updatedAt; }).forEach(function(note) {
        var item = document.createElement('div');
        item.className = 'note-item';
        var dateStr = new Date(note.updatedAt).toLocaleString('zh-CN');
        item.innerHTML = '<div class="note-meta">' +
          '<span class="note-qid">题目: ' + note.qid + '</span>' +
          '<span>' + dateStr + '</span>' +
          '</div>' +
          '<div class="note-text">' + escapeHtml(note.text) + '</div>' +
          '<div class="note-actions">' +
          '<button class="btn btn-sm" onclick="editNote(\'' + note.qid + '\',\'' + subject + '\')">编辑</button>' +
          '<button class="btn btn-sm btn-danger" onclick="deleteNote(\'' + note.qid + '\',\'' + subject + '\')">删除</button>' +
          '</div>';
        list.appendChild(item);
      });

      group.appendChild(list);
      container.appendChild(group);
    });

    renderHighlights();
  }

  function renderHighlights() {
    var data = {};
    try {
      data = JSON.parse(localStorage.getItem('study_highlights') || '{}');
    } catch (e) {}

    var container = document.getElementById('highlightsList');
    container.innerHTML = '';
    var keys = Object.keys(data);
    if (!keys.length) {
      container.innerHTML = '<p class="muted">暂无高亮标注。</p>';
      return;
    }
    keys.forEach(function(qid) {
      var h = data[qid];
      var div = document.createElement('div');
      div.className = 'highlight-item';
      div.innerHTML = '<div class="highlight-qid">题目: ' + h.qid + '</div>' +
        '<div class="highlight-text">' + escapeHtml(h.text) + '</div>';
      container.appendChild(div);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  window.editNote = function(qid, subject) {
    var note = window.Notes.getNote(qid, subject);
    if (!note) return;
    var text = prompt('编辑笔记:', note.text);
    if (text !== null) {
      window.Notes.addNote(qid, text, subject);
      render();
    }
  };

  window.deleteNote = function(qid, subject) {
    if (confirm('确定删除此笔记？')) {
      window.Notes.deleteNote(qid, subject);
      render();
    }
  };

  window.exportNotes = function() {
    var json = window.Notes.export();
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'study-notes-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  };

  window.importNotes = function(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var success = window.Notes.import(e.target.result);
      if (success) {
        alert('导入成功！');
        render();
      } else {
        alert('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  };

  window.clearAll = function() {
    if (confirm('确定清空所有笔记和高亮？此操作不可恢复。')) {
      window.Notes.clear();
      render();
    }
  };

  render();

})();
</script>

</body>
</html>

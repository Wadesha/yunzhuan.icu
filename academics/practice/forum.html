<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习论坛 · Forum | Practice v47</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; background: #ffffff; color: #111111; line-height: 1.7; font-size: 15px; }
  a { color: #111111; text-decoration: none; border-bottom: 1px solid #cccccc; }
  a:hover { border-bottom-color: #111111; }
  .nav { padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid #e0e0e0; font-size: 0.88rem; color: #888888; }
  .nav a { color: #111111; }
  .nav .sep { color: #cccccc; margin: 0 6px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; font-weight: 700; margin: 28px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #111111; }
  h3 { font-size: 1rem; font-weight: 700; margin: 18px 0 6px; }
  p { margin-bottom: 8px; }
  .muted { color: #888888; font-size: 0.85rem; }
  .subtitle { color: #555555; font-size: 0.95rem; margin-bottom: 20px; }
  .badge { display: inline-block; border: 1px solid #111111; padding: 0 6px; font-size: 0.7rem; font-weight: 700; }
  .badge-cat { display: inline-block; border: 1px solid #111; padding: 1px 6px; font-size: 0.7rem; font-weight: 700; margin-right: 6px; }
  .v-info { border: 1px dashed #888888; padding: 8px 12px; margin: 12px 0; font-size: 0.82rem; color: #555555; }
  .grid-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
  @media (max-width: 768px) { .grid-cats { grid-template-columns: 1fr 1fr; } }
  .cat-card { border: 1px solid #e0e0e0; padding: 14px; background: #ffffff; cursor: pointer; transition: all 0.2s; }
  .cat-card:hover { border-color: #111; background: #fafafa; }
  .cat-card.active { border-color: #111; background: #f5f5f5; }
  .cat-card h3 { margin-top: 0; margin-bottom: 4px; font-size: 0.95rem; }
  .cat-card p { font-size: 0.78rem; color: #888; margin: 0; }
  .cat-card .count { font-size: 0.72rem; color: #555; margin-top: 4px; }
  .post-form { border: 1px solid #e0e0e0; padding: 14px 16px; background: #fafafa; margin: 12px 0; }
  input, textarea, button, select { font-family: inherit; font-size: 0.9rem; }
  input[type=text], textarea, select { border: 1px solid #cccccc; padding: 6px 10px; width: 100%; box-sizing: border-box; font-size: 0.9rem; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #111111; outline-offset: -1px; }
  textarea { resize: vertical; min-height: 80px; }
  button { border: 1px solid #111111; background: #fff; color: #111111; padding: 6px 14px; cursor: pointer; font-weight: 600; }
  button:hover { background: #111111; color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: #111111; color: #fff; }
  button.primary:hover { background: #333; }
  button.small { padding: 3px 10px; font-size: 0.8rem; }
  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 0.82rem; color: #555; margin-bottom: 4px; }
  .post-list { list-style: none; margin: 12px 0; padding: 0; }
  .post-item { border: 1px solid #e0e0e0; padding: 12px 14px; margin-bottom: 8px; background: #fff; transition: all 0.15s; }
  .post-item:hover { border-color: #111; background: #fafafa; }
  .post-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .post-title a { border-bottom: none; }
  .post-title a:hover { color: #555; }
  .post-meta { color: #888; font-size: 0.78rem; }
  .post-stats { display: inline-block; margin-left: 8px; color: #555; font-size: 0.78rem; }
  .post-stats span { margin-right: 8px; }
  .pagination { display: flex; gap: 4px; margin: 16px 0; align-items: center; flex-wrap: wrap; }
  .pagination button { padding: 4px 10px; font-size: 0.82rem; }
  .pagination button.active { background: #111; color: #fff; }
  .pagination .info { font-size: 0.82rem; color: #555; margin-left: auto; }
  .tab-bar { display: flex; border-bottom: 1px solid #e0e0e0; margin: 16px 0 12px; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 0.88rem; border-bottom: 2px solid transparent; color: #555; }
  .tab.active { border-bottom-color: #111; color: #111; font-weight: 700; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .empty-state { text-align: center; padding: 32px; color: #888; font-size: 0.88rem; border: 1px dashed #e0e0e0; }
  .footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid #e0e0e0; color: #888888; font-size: 0.82rem; }
  .stat-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .stat-bar > div { border: 1px solid #e0e0e0; padding: 8px; text-align: center; }
  .stat-bar b { font-size: 1.2rem; display: block; }
  .stat-bar span { font-size: 0.78rem; color: #888; }
  @media (max-width: 768px) { .stat-bar { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="nav">
  <a href="../../index.html">Home</a> <span class="sep">/</span>
  <a href="../index.html">Academics</a> <span class="sep">/</span>
  <a href="index.html">Practice</a> <span class="sep">/</span>
  学习论坛
</div>

<h1>学习论坛 <span class="badge">v47</span></h1>
<p class="subtitle">4 大分类 · 发帖回帖 · 点赞互动 · 浏览数/回复数/点赞数全统计</p>

<div class="v-info">
  <strong>使用说明</strong> · 选择分类进入，发帖时填写标题和正文（匿名亦可）；点击帖子查看详情、回帖、点赞。所有数据存储在 localStorage 中，清空浏览器数据会重置。
</div>

<div class="stat-bar" id="statBar">
  <div><b id="statPosts">0</b><span>帖子总数</span></div>
  <div><b id="statReplies">0</b><span>回帖总数</span></div>
  <div><b id="statLikes">0</b><span>点赞总数</span></div>
  <div><b id="statUsers">0</b><span>活跃用户</span></div>
</div>

<h2>分类入口</h2>
<div class="grid-cats" id="catGrid"></div>

<div class="tab-bar">
  <div class="tab active" data-tab="list">帖子列表</div>
  <div class="tab" data-tab="newpost">我要发帖</div>
</div>

<div class="tab-content active" id="tab-list">
  <h2 id="listTitle">全部帖子</h2>
  <div id="postList" class="post-list"></div>
  <div class="pagination" id="pagination"></div>
</div>

<div class="tab-content" id="tab-newpost">
  <h2>发表新帖</h2>
  <div class="post-form">
    <div class="form-row">
      <label>分类</label>
      <select id="newCategory"></select>
    </div>
    <div class="form-row">
      <label>标题</label>
      <input type="text" id="newTitle" maxlength="200" placeholder="一句话概括你的问题或分享">
    </div>
    <div class="form-row">
      <label>正文</label>
      <textarea id="newContent" maxlength="5000" placeholder="详细描述你的内容..."></textarea>
    </div>
    <div class="form-row">
      <label>昵称（可留空）</label>
      <input type="text" id="newAuthor" maxlength="20" placeholder="匿名">
    </div>
    <button class="primary" id="submitPostBtn">发表</button>
    <button class="small" id="resetPostBtn">清空</button>
    <p class="muted" id="postMsg" style="margin-top:8px;"></p>
  </div>
</div>

<div class="footer">
  <a href="../../index.html">Home</a> · <a href="index.html">Practice</a> · <a href="qa.html">问答</a> · <a href="school-circle.html">学校圈</a> · <a href="buddy.html">战友</a>
</div>

<script src="../../js/forum.js"></script>
<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var currentCategory = ''; // empty = all
  var currentPage = 1;
  var catData = Forum.CATEGORIES;

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === name);
    });
    document.querySelectorAll('.tab-content').forEach(function(c) {
      c.classList.toggle('active', c.id === 'tab-' + name);
    });
  }
  document.querySelectorAll('.tab').forEach(function(t) {
    t.addEventListener('click', function() { showTab(t.getAttribute('data-tab')); });
  });

  function renderCatGrid() {
    var html = '<div class="cat-card" data-key=""><h3>全部</h3><p>所有分类的帖子</p><div class="count" id="cnt-all">— 篇</div></div>';
    catData.forEach(function(c) {
      html += '<div class="cat-card" data-key="' + c.key + '"><h3>' + c.name + '</h3><p>' + c.desc + '</p><div class="count" id="cnt-' + c.key + '">— 篇</div></div>';
    });
    $('catGrid').innerHTML = html;

    // counts
    var all = Forum.getPosts('', 1);
    $('cnt-all').textContent = all.total + ' 篇';
    catData.forEach(function(c) {
      var p = Forum.getPosts(c.key, 1);
      $( 'cnt-' + c.key).textContent = p.total + ' 篇';
    });

    document.querySelectorAll('.cat-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var key = card.getAttribute('data-key');
        currentCategory = key;
        currentPage = 1;
        document.querySelectorAll('.cat-card').forEach(function(c2) { c2.classList.remove('active'); });
        card.classList.add('active');
        showTab('list');
        renderList();
      });
    });

    $('newCategory').innerHTML = catData.map(function(c) {
      return '<option value="' + c.key + '">' + c.name + '</option>';
    }).join('');
  }

  function renderList() {
    var result = Forum.getPosts(currentCategory, currentPage);
    var titleText = currentCategory ? (Forum.getCategory(currentCategory).name) : '全部帖子';
    $('listTitle').textContent = titleText + ' · ' + result.total + ' 篇';

    if (result.items.length === 0) {
      $('postList').innerHTML = '<div class="empty-state">暂无帖子 · 来发第一帖吧</div>';
      $('pagination').innerHTML = '';
      return;
    }
    var html = '';
    result.items.forEach(function(p) {
      var cat = Forum.getCategory(p.category);
      var time = formatTime(p.createdAt);
      html += '<li class="post-item">';
      html += '<div class="post-title">';
      html += '<span class="badge-cat">' + (cat ? cat.name : p.category) + '</span>';
      html += '<a href="forum-post.html?id=' + p.id + '">' + escapeHtml(p.title) + '</a>';
      html += '</div>';
      html += '<div class="post-meta">';
      html += '作者：' + escapeHtml(p.author) + ' · ' + time;
      html += '<div class="post-stats">';
      html += '<span>👁 ' + p.views + ' 浏览</span>';
      html += '<span>💬 ' + p.replyCount + ' 回复</span>';
      html += '<span>♡ ' + p.likeCount + ' 赞</span>';
      html += '</div></div>';
      html += '</li>';
    });
    $('postList').innerHTML = html;
    renderPagination(result);
  }

  function renderPagination(result) {
    if (result.totalPages <= 1) {
      $('pagination').innerHTML = '<span class="info">第 ' + result.page + ' / ' + result.totalPages + ' 页</span>';
      return;
    }
    var html = '';
    var max = result.totalPages;
    for (var i = 1; i <= max; i++) {
      html += '<button class="' + (i === result.page ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '<span class="info">第 ' + result.page + ' / ' + result.totalPages + ' 页 · 共 ' + result.total + ' 篇</span>';
    $('pagination').innerHTML = html;
    document.querySelectorAll('#pagination button').forEach(function(b) {
      b.addEventListener('click', function() {
        currentPage = parseInt(b.getAttribute('data-page'), 10) || 1;
        renderList();
        window.scrollTo(0, 0);
      });
    });
  }

  function renderStats() {
    var totalPosts = 0, totalReplies = 0, totalLikes = 0, userSet = {};
    catData.forEach(function(c) {
      var p = Forum.getPosts(c.key, 1);
      totalPosts += p.total;
      p.items.forEach(function(item) {
        // count replies & likes (approximate via API)
        var replies = Forum.getReplies(item.id);
        totalReplies += replies.length;
        userSet[item.author] = true;
      });
    });
    // likes
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k === 'yz_forum_likes') {
        try {
          var likes = JSON.parse(localStorage.getItem(k));
          Object.keys(likes).forEach(function(pid) { totalLikes += Object.keys(likes[pid]).length; });
        } catch(e) {}
      }
    }
    $('statPosts').textContent = totalPosts;
    $('statReplies').textContent = totalReplies;
    $('statLikes').textContent = totalLikes;
    $('statUsers').textContent = Object.keys(userSet).length;
  }

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = Date.now();
    var diff = (now - ts) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  $('submitPostBtn').addEventListener('click', function() {
    var cat = $('newCategory').value;
    var title = $('newTitle').value.trim();
    var content = $('newContent').value.trim();
    var author = $('newAuthor').value.trim() || '匿名';
    if (!title) { $('postMsg').textContent = '请输入标题'; return; }
    if (!content) { $('postMsg').textContent = '请输入正文'; return; }
    try {
      var p = Forum.post(cat, title, content, author);
      $('postMsg').textContent = '发表成功！跳转到详情...';
      $('newTitle').value = '';
      $('newContent').value = '';
      $('newAuthor').value = '';
      setTimeout(function() {
        window.location.href = 'forum-post.html?id=' + p.id;
      }, 600);
    } catch (e) {
      $('postMsg').textContent = '错误：' + e.message;
    }
  });
  $('resetPostBtn').addEventListener('click', function() {
    $('newTitle').value = '';
    $('newContent').value = '';
    $('newAuthor').value = '';
    $('postMsg').textContent = '';
  });

  renderCatGrid();
  renderList();
  renderStats();
})();
</script>
</body>
</html>

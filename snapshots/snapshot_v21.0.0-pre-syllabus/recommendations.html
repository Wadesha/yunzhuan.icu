<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            max-width: 760px;
            margin: 0 auto;
            padding: 20px;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        nav {
            padding: 10px 0;
            border-bottom: 1px solid #ccc;
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #000;
        }
        h2 {
            font-size: 20px;
            margin: 20px 0 10px 0;
            color: #000;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        h3 {
            font-size: 16px;
            margin: 15px 0 8px 0;
            color: #000;
        }
        .profile-section {
            background: #f9f9f9;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ddd;
        }
        .profile-item {
            margin: 8px 0;
        }
        .profile-item label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        .profile-item input,
        .profile-item select {
            padding: 4px 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .btn {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 5px 5px 0;
        }
        .btn:hover {
            background: #0055aa;
        }
        .btn-secondary {
            background: #666;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .recommendation-section {
            margin: 15px 0;
        }
        .rec-card {
            border: 1px solid #ddd;
            padding: 12px;
            margin: 10px 0;
            background: #fff;
        }
        .rec-card h4 {
            margin-bottom: 5px;
            color: #000;
        }
        .match-bar {
            background: #eee;
            height: 20px;
            margin: 8px 0;
            position: relative;
        }
        .match-fill {
            background: #0066cc;
            height: 100%;
            color: #fff;
            text-align: center;
            font-size: 12px;
            line-height: 20px;
        }
        .courses-list {
            background: #f9f9f9;
            padding: 15px;
            border: 1px #ddd;
        }
        .courses-list li {
            margin: 5px 0;
        }
        .engine-note {
            background: #f0f0f0;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .engine-note ul {
            margin-left: 20px;
            margin-top: 8px;
        }
        .engine-note li {
            margin: 3px 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">首页</a>
        <a href="#">推荐</a>
        <a href="#">规划</a>
        <a href="#">关于</a>
    </nav>

    <h1>Personalized Recommendations 个性化推荐</h1>

    <section class="profile-section">
        <h2>用户画像</h2>
        <div class="profile-item">
            <label>年级：</label>
            <select id="grade">
                <option value="9">9年级</option>
                <option value="10">10年级</option>
                <option value="11" selected>11年级</option>
                <option value="12">12年级</option>
            </select>
        </div>
        <div class="profile-item">
            <label>目标专业：</label>
            <select id="major">
                <option value="cs" selected>CS (计算机科学)</option>
                <option value="math">Math (数学)</option>
                <option value="physics">Physics (物理)</option>
                <option value="engineering">Engineering (工程)</option>
            </select>
        </div>
        <div class="profile-item">
            <label>已有竞赛：</label>
            <input type="text" id="competitions" value="AMC 10" placeholder="多个竞赛用逗号分隔">
        </div>
        <div class="profile-item">
            <label>GPA：</label>
            <input type="number" id="gpa" value="3.8" min="0" max="4.0" step="0.1">
        </div>
        <div class="profile-item">
            <label>SAT：</label>
            <input type="number" id="sat" value="1450" min="400" max="1600" step="10">
        </div>
        <button class="btn" onclick="updateProfile()">更新画像</button>
        <button class="btn btn-secondary" onclick="refreshRecommendations()">刷新推荐</button>
    </section>

    <section class="recommendation-section">
        <h2>竞赛推荐</h2>
        <div id="competition-recs"></div>
    </section>

    <section class="recommendation-section">
        <h2>学校推荐</h2>
        <div id="school-recs"></div>
    </section>

    <section class="recommendation-section">
        <h2>课程建议</h2>
        <div class="courses-list">
            <ul id="courses">
                <li><strong>AP Computer Science A</strong> - CS基础课程，大学必修</li>
                <li><strong>Linear Algebra</strong> - 数学进阶，为AI/ML打基础</li>
                <li><strong>AP Physics C</strong> - 理工科核心课程</li>
            </ul>
        </div>
    </section>

    <section class="engine-note">
        <h2>推荐引擎说明</h2>
        <p>本系统采用多维度推荐算法：</p>
        <ul>
            <li><strong>规则引擎：</strong>基于专业匹配度、年级阶段、竞赛历史进行基础筛选</li>
            <li><strong>协同过滤：</strong>参考相似用户的历史选择和录取结果</li>
            <li><strong>LLM增强：</strong>结合大语言模型分析个性化匹配理由和提升建议</li>
        </ul>
    </section>

    <script>
        const PROFILE = { grade: 11, major: 'cs', competitions: ['amc10'], gpa: 3.8, sat: 1450 };
        const RECOMMENDATIONS = {
            competitions: [
                { name: 'USACO', reason: 'CS专业核心竞赛，匹配度95%', match: 95 },
                { name: 'HiMCM', reason: '数学建模对CS申请加分，匹配度85%', match: 85 },
                { name: 'AIME', reason: '数学能力强可冲刺，匹配度78%', match: 78 }
            ],
            schools: [
                { name: 'CMU', reason: 'CS排名高，你的成绩匹配', match: 88 },
                { name: 'Cornell', reason: '理工科强校，ED录取率更高', match: 82 },
                { name: 'Georgia Tech', reason: '性价比高，CS就业好', match: 90 }
            ]
        };

        function renderRecommendations() {
            const compContainer = document.getElementById('competition-recs');
            const schoolContainer = document.getElementById('school-recs');

            compContainer.innerHTML = RECOMMENDATIONS.competitions.map(c => `
                <div class="rec-card">
                    <h4>${c.name}</h4>
                    <p>${c.reason}</p>
                    <div class="match-bar">
                        <div class="match-fill" style="width: ${c.match}%">${c.match}%</div>
                    </div>
                </div>
            `).join('');

            schoolContainer.innerHTML = RECOMMENDATIONS.schools.map(s => `
                <div class="rec-card">
                    <h4>${s.name}</h4>
                    <p>${s.reason}</p>
                    <div class="match-bar">
                        <div class="match-fill" style="width: ${s.match}%">${s.match}%</div>
                    </div>
                </div>
            `).join('');
        }

        function updateProfile() {
            PROFILE.grade = parseInt(document.getElementById('grade').value);
            PROFILE.major = document.getElementById('major').value;
            PROFILE.competitions = document.getElementById('competitions').value.split(',').map(c => c.trim().toLowerCase().replace(/\s+/g, ''));
            PROFILE.gpa = parseFloat(document.getElementById('gpa').value);
            PROFILE.sat = parseInt(document.getElementById('sat').value);
            alert('画像已更新！\n\n年级: ' + PROFILE.grade + '\n专业: ' + PROFILE.major + '\n竞赛: ' + PROFILE.competitions.join(', ') + '\nGPA: ' + PROFILE.gpa + '\nSAT: ' + PROFILE.sat);
        }

        function refreshRecommendations() {
            // 模拟推荐刷新
            const randomFactor = () => Math.floor(Math.random() * 10) - 5;
            RECOMMENDATIONS.competitions.forEach(c => {
                c.match = Math.min(100, Math.max(50, c.match + randomFactor()));
            });
            RECOMMENDATIONS.schools.forEach(s => {
                s.match = Math.min(100, Math.max(50, s.match + randomFactor()));
            });
            renderRecommendations();
        }

        // 初始化渲染
        renderRecommendations();
    </script>
    <script src="js/back-to-top.js"></script>
</body>
</html>

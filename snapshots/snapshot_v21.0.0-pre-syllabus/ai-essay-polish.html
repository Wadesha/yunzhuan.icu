<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Essay Polish - AI文书润色</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #000;
            background-color: #fff;
            max-width: 760px;
            margin: 0 auto;
            padding: 20px;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 导航栏 */
        nav {
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            font-weight: 500;
        }

        /* 标题 */
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        h1 span {
            font-size: 20px;
            color: #666;
        }

        h2 {
            font-size: 20px;
            margin: 20px 0 10px 0;
        }

        h3 {
            font-size: 16px;
            margin: 15px 0 10px 0;
        }

        /* 文书类型选择 */
        .essay-type {
            margin-bottom: 20px;
        }

        .essay-type label {
            display: inline-block;
            margin-right: 15px;
            cursor: pointer;
        }

        .essay-type input[type="radio"] {
            margin-right: 5px;
        }

        /* 文本输入区 */
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: 2px solid #0066cc;
            outline-offset: -2px;
        }

        /* 润色选项 */
        .polish-options {
            margin: 20px 0;
        }

        .polish-options label {
            display: inline-block;
            margin-right: 20px;
            cursor: pointer;
        }

        .polish-options input[type="checkbox"] {
            margin-right: 5px;
        }

        /* 按钮 */
        .btn-polish {
            background-color: #0066cc;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-polish:hover {
            background-color: #0052a3;
        }

        .btn-polish:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 每日次数提示 */
        .daily-limit {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        /* 结果展示 */
        .result-section {
            margin-top: 30px;
            display: none;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .comparison-box {
            border: 1px solid #ccc;
            padding: 15px;
        }

        .comparison-box h3 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .comparison-box p {
            font-size: 14px;
            line-height: 1.8;
        }

        /* 问题标注列表 */
        .issues-list {
            margin: 20px 0;
        }

        .issue-item {
            border-left: 3px solid #0066cc;
            padding: 10px 15px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }

        .issue-type {
            font-weight: bold;
            color: #0066cc;
            font-size: 12px;
            text-transform: uppercase;
        }

        .issue-original {
            color: #c00;
            text-decoration: line-through;
        }

        .issue-suggestion {
            color: #060;
            font-weight: bold;
        }

        /* 评分 */
        .scores {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .overall-score {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
        }

        /* 改进建议 */
        .suggestions {
            margin-top: 20px;
        }

        .suggestions ul {
            margin-left: 20px;
        }

        .suggestions li {
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .comparison {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <ul>
            <li><a href="/">首页</a></li>
            <li><a href="/essay">文书润色</a></li>
            <li><a href="/about">关于</a></li>
        </ul>
    </nav>

    <!-- 标题 -->
    <h1>AI Essay Polish <span>AI文书润色</span></h1>

    <!-- 文书类型选择 -->
    <div class="essay-type">
        <h3>文书类型</h3>
        <label><input type="radio" name="essay-type" value="common-app" checked> Common App</label>
        <label><input type="radio" name="essay-type" value="supplemental"> Supplemental</label>
        <label><input type="radio" name="essay-type" value="uc"> UC Personal Statement</label>
    </div>

    <!-- 文本输入区 -->
    <div class="input-section">
        <h3>输入文书内容</h3>
        <textarea id="essay-input" placeholder="请在此输入您的文书内容..."></textarea>
    </div>

    <!-- 润色选项 -->
    <div class="polish-options">
        <h3>润色选项</h3>
        <label><input type="checkbox" id="opt-grammar" checked> 语法检查</label>
        <label><input type="checkbox" id="opt-wording" checked> 用词优化</label>
        <label><input type="checkbox" id="opt-structure" checked> 结构建议</label>
        <label><input type="checkbox" id="opt-theme" checked> 主题契合度评分</label>
    </div>

    <!-- 运行润色按钮 -->
    <button class="btn-polish" id="btn-polish">运行润色</button>

    <!-- 每日免费次数提示 -->
    <p class="daily-limit">今日剩余免费次数：<span id="remaining-count">3</span>/3</p>

    <!-- 结果展示 -->
    <div class="result-section" id="result-section">
        <h2>润色结果</h2>

        <!-- 原文 vs 润色后对比 -->
        <div class="comparison">
            <div class="comparison-box">
                <h3>原文</h3>
                <p id="original-text"></p>
            </div>
            <div class="comparison-box">
                <h3>润色后</h3>
                <p id="polished-text"></p>
            </div>
        </div>

        <!-- 问题标注列表 -->
        <div class="issues-list">
            <h3>问题标注</h3>
            <div id="issues-container"></div>
        </div>

        <!-- 评分 -->
        <div class="scores">
            <h3>评分详情</h3>
            <div class="score-item">
                <span>语法得分：</span>
                <span id="score-grammar">--</span>
            </div>
            <div class="score-item">
                <span>用词得分：</span>
                <span id="score-vocabulary">--</span>
            </div>
            <div class="score-item">
                <span>结构得分：</span>
                <span id="score-structure">--</span>
            </div>
            <div class="score-item">
                <span>主题契合度：</span>
                <span id="score-theme">--</span>
            </div>
            <div class="overall-score">
                综合得分：<span id="score-overall">--</span>
            </div>
        </div>

        <!-- 改进建议 -->
        <div class="suggestions">
            <h3>改进建议</h3>
            <ul id="suggestions-list">
                <li>使用更具体的词汇替代模糊表达</li>
                <li>增强段落之间的逻辑连贯性</li>
                <li>开头使用更有力的动词吸引读者</li>
            </ul>
        </div>
    </div>

    <script>
        // 模拟数据
        const SAMPLE_INPUT = "I have always been interested in computer science since I was young. I built my first website when I was 12. This experience taught me a lot about programming.";
        
        const POLISH_RESULT = {
            polished: "My journey in computer science began at age twelve, when I built my first website from scratch. That hands-on experience ignited my passion for programming and taught me the fundamentals of web development.",
            issues: [
                { type: 'grammar', original: 'have always been', suggestion: 'began', reason: '更强有力的动词' },
                { type: 'wording', original: 'a lot', suggestion: 'the fundamentals', reason: '更具体' },
                { type: 'structure', original: 'I built...', suggestion: 'That hands-on experience...', reason: '增加连贯性' }
            ],
            scores: { grammar: 85, vocabulary: 78, structure: 72, theme: 80 },
            overall: 79
        };

        // localStorage 次数管理
        const DAILY_LIMIT = 3;
        const STORAGE_KEY = 'essay_polish_count';
        const DATE_KEY = 'essay_polish_date';

        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function getRemainingCount() {
            const today = getTodayDate();
            const savedDate = localStorage.getItem(DATE_KEY);
            
            if (savedDate !== today) {
                localStorage.setItem(DATE_KEY, today);
                localStorage.setItem(STORAGE_KEY, '0');
                return DAILY_LIMIT;
            }
            
            const usedCount = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
            return Math.max(0, DAILY_LIMIT - usedCount);
        }

        function usePolishCount() {
            const today = getTodayDate();
            const savedDate = localStorage.getItem(DATE_KEY);
            
            if (savedDate !== today) {
                localStorage.setItem(DATE_KEY, today);
                localStorage.setItem(STORAGE_KEY, '1');
                return DAILY_LIMIT - 1;
            }
            
            let usedCount = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
            usedCount++;
            localStorage.setItem(STORAGE_KEY, usedCount.toString());
            
            return Math.max(0, DAILY_LIMIT - usedCount);
        }

        function updateRemainingDisplay() {
            const remaining = getRemainingCount();
            document.getElementById('remaining-count').textContent = remaining;
            
            const btn = document.getElementById('btn-polish');
            btn.disabled = remaining <= 0;
        }

        // 润色功能
        function runPolish() {
            const inputText = document.getElementById('essay-input').value.trim();
            
            if (!inputText) {
                alert('请输入文书内容');
                return;
            }
            
            // 检查次数
            const remaining = getRemainingCount();
            if (remaining <= 0) {
                alert('今日免费次数已用完，请明天再试');
                return;
            }
            
            // 消耗次数
            const newRemaining = usePolishCount();
            updateRemainingDisplay();
            
            // 显示结果区域
            const resultSection = document.getElementById('result-section');
            resultSection.style.display = 'block';
            
            // 显示原文和润色后文本
            document.getElementById('original-text').textContent = inputText;
            document.getElementById('polished-text').textContent = POLISH_RESULT.polished;
            
            // 显示问题标注
            const issuesContainer = document.getElementById('issues-container');
            issuesContainer.innerHTML = '';
            
            POLISH_RESULT.issues.forEach(issue => {
                const issueDiv = document.createElement('div');
                issueDiv.className = 'issue-item';
                issueDiv.innerHTML = `
                    <div class="issue-type">${issue.type}</div>
                    <p>
                        原文: <span class="issue-original">${issue.original}</span> 
                        → 建议: <span class="issue-suggestion">${issue.suggestion}</span>
                    </p>
                    <p><em>理由: ${issue.reason}</em></p>
                `;
                issuesContainer.appendChild(issueDiv);
            });
            
            // 显示评分
            document.getElementById('score-grammar').textContent = POLISH_RESULT.scores.grammar;
            document.getElementById('score-vocabulary').textContent = POLISH_RESULT.scores.vocabulary;
            document.getElementById('score-structure').textContent = POLISH_RESULT.scores.structure;
            document.getElementById('score-theme').textContent = POLISH_RESULT.scores.theme;
            document.getElementById('score-overall').textContent = POLISH_RESULT.overall;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateRemainingDisplay();
            
            // 绑定按钮事件
            document.getElementById('btn-polish').addEventListener('click', runPolish);
        });
    </script>
    <script src="js/back-to-top.js"></script>
</body>
</html>

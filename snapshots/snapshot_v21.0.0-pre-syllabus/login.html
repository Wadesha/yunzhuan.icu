<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - yunzhuan.icu</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary, #f5f5f5);
            color: var(--text-primary, #333);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--bg-secondary, white);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .logo {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }
        .logo span { color: #764ba2; }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            background: #fee2e2;
            color: #b71c1c;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 14px;
            display: none;
        }
        .success-msg {
            background: #e8f5e9;
            color: #1b5e20;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 14px;
            display: none;
        }
        .forgot-link {
            text-align: right;
            margin-bottom: 14px;
        }
        .forgot-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #888;
            text-decoration: none;
            font-size: 0.82rem;
        }
        .back-link a:hover { color: #667eea; }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
    </style>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="auth-card">
        <div class="logo"><span class="logo-icon">🎓</span><span class="logo-text">yunzhuan<span>.icu</span></span></div>
        <p class="subtitle">Demo Preview · 登录功能预览版</p>

        <div class="tabs">
            <div class="tab active" data-tab="signin">Sign In</div>
            <div class="tab" data-tab="signup">Sign Up</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg" style="display:block;">
            👋 <strong>Demo mode</strong> — 输入任意邮箱密码即可预览登录后效果。
        </div>

        <div class="form-panel active" id="signin-panel">
            <form id="signin-form">
                <div class="form-group">
                <label>Email</label>
                <input type="email" id="signin-email" value="demo@yunzhuan.icu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signin-password" value="demo1234" required>
            </div>
            <div class="forgot-link">
                <a href="#" id="forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn" id="signin-btn">Sign In (Demo)</button>
            </form>
        </div>

        <div class="form-panel" id="signup-panel">
            <form id="signup-form">
                <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="signup-password" minlength="6" required>
            </div>
            <button type="submit" class="btn" id="signup-btn">Create Account (Demo)</button>
            </form>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to home</a>
        </div>
    </div>

<script>
(function() {
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.form-panel');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
    }
    function showSuccess(msg) {
        successMsg.textContent = msg;
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
    }
    function hideMessages() {
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            tabs.forEach(t => t.classList.remove('active'));
            panels.forEach(p => p.classList.remove('active'));
            this.classList.add('active');
            document.getElementById(this.dataset.tab + '-panel').classList.add('active');
            hideMessages();
        });
    });

    document.getElementById('signin-form').addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        const btn = document.getElementById('signin-btn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        setTimeout(() => {
            localStorage.setItem('yunzhuan_demo_user', JSON.stringify({
                email: document.getElementById('signin-email').value,
                name: 'Demo User',
                joined: new Date().toISOString()
            }));
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'profile.html';
            window.location.href = redirect;
        }, 600);
    });

    document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        const btn = document.getElementById('signup-btn');
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        setTimeout(() => {
            showSuccess('✅ Demo: Account created! Switch to Sign In tab to continue.');
            btn.disabled = false;
            btn.textContent = 'Create Account (Demo)';
            tabs[0].click();
            document.getElementById('signin-email').value = document.getElementById('signup-email').value;
        }, 800);
    });

    document.getElementById('forgot-link').addEventListener('click', function(e) {
        e.preventDefault();
        const email = prompt('Enter your email to reset password:');
        if (!email) return;
        showSuccess('📧 Demo: Password reset email would be sent to ' + email);
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'signup') {
        tabs[1].click();
    }
    if (params.get('reset') === '1') {
        showSuccess('Set your new password');
    }
})();
</script>
</body>
</html>

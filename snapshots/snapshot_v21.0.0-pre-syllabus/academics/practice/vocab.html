<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Flashcards</title>
<link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; background: #ffffff; color: #111111; line-height: 1.7; font-size: 15px; }
a { color: #111111; text-decoration: none; border-bottom: 1px solid #cccccc; }
a:hover { border-bottom-color: #111111; }
.nav { padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid #e0e0e0; font-size: 0.88rem; color: #888888; }
.nav a { color: #111111; }
.nav .sep { color: #cccccc; margin: 0 6px; }
h1 { font-size: 1.6rem; margin-bottom: 4px; }
h2 { font-size: 1.1rem; font-weight: 700; margin: 28px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #111111; }
h3 { font-size: 0.98rem; font-weight: 700; margin: 16px 0 4px; }
p, li { margin-bottom: 6px; color: #111111; }
.muted { color: #888888; font-size: 0.85rem; }
.subtitle { color: #555555; font-size: 0.95rem; margin-bottom: 20px; }
.box { border: 1px solid #111111; padding: 14px 18px; margin: 12px 0; }
.box-dashed { border: 1px dashed #888888; padding: 14px 18px; margin: 12px 0; }
.footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid #e0e0e0; color: #888888; font-size: 0.82rem; }
.v-badge { display: inline-block; border: 1px solid #111111; padding: 0 6px; font-size: 0.7rem; font-weight: 700; }
.btn { display: inline-block; padding: 6px 14px; border: 1px solid #111; background: #fff; color: #111; font-family: inherit; font-size: 0.85rem; cursor: pointer; margin-right: 6px; }
.btn:hover { background: #111; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }
.btn-primary { background: #111; color: #fff; }
.btn-primary:hover { background: #333; }
.btn-lg { padding: 10px 24px; font-size: 1rem; }

.type-selector { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
.type-card { border: 2px solid #111; padding: 16px 24px; cursor: pointer; text-align: center; min-width: 120px; transition: all 0.15s; }
.type-card:hover { background: #111; color: #fff; }
.type-card .type-name { font-size: 1.2rem; font-weight: 700; }
.type-card .type-stats { font-size: 0.78rem; color: #555; margin-top: 4px; }
.type-card:hover .type-stats { color: #ccc; }
.type-card.active { background: #111; color: #fff; }
.type-card.active .type-stats { color: #ccc; }

.flashcard-container { perspective: 1000px; margin: 24px 0; min-height: 220px; }
.flashcard { position: relative; width: 100%; min-height: 200px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-front, .flashcard-back { position: absolute; width: 100%; min-height: 200px; backface-visibility: hidden; border: 2px solid #111; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
.flashcard-back { transform: rotateY(180deg); }
.flashcard-front .word { font-size: 2rem; font-weight: 700; }
.flashcard-front .pos { font-size: 0.9rem; color: #555; margin-top: 4px; }
.flashcard-front .hint { font-size: 0.82rem; color: #888; margin-top: 12px; }
.flashcard-back .def { font-size: 1.2rem; font-weight: 700; text-align: center; }
.flashcard-back .ex { font-size: 0.9rem; color: #555; margin-top: 12px; font-style: italic; text-align: center; }
.flashcard-status { position: absolute; top: 8px; right: 12px; font-size: 0.75rem; color: #888; }

.progress-bar { width: 100%; height: 8px; border: 1px solid #111; margin: 12px 0; position: relative; }
.progress-bar-fill { height: 100%; background: #111; transition: width 0.3s; }
.progress-text { display: flex; justify-content: space-between; font-size: 0.82rem; color: #555; }

.action-buttons { display: flex; gap: 10px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
.action-buttons .btn { padding: 8px 20px; }
.btn-known { border-color: #111; }
.btn-unknown { border-color: #888; }
.btn-finish { background: #111; color: #fff; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 16px 0; }
.stat-item { border: 1px solid #e0e0e0; padding: 12px; text-align: center; }
.stat-value { font-size: 1.5rem; font-weight: 700; }
.stat-label { font-size: 0.82rem; color: #555; }

.review-list { margin: 12px 0; }
.review-item { border: 1px solid #e0e0e0; padding: 8px 12px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; }
.review-word { font-weight: 700; }
.review-type { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>

<div class="nav">
  <a href="../../../index.html">Home</a> <span class="sep">/</span>
  <a href="../../index.html">Academics</a> <span class="sep">/</span>
  <a href="../index.html">Practice</a> <span class="sep">/</span>
  Vocab
</div>

<h1>Vocab Flashcards <span class="v-badge">v32</span></h1>
<p class="subtitle">高频词汇卡片 · 点击翻页 · 认识/不认识标记 · 进度自动保存</p>

<div id="typeSelector">
  <h2>选择词表</h2>
  <div class="type-selector" id="typeCards"></div>
</div>

<div id="studyArea" style="display:none;">
  <div class="progress-bar">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-text">
    <span id="progressText">0 / 0</span>
    <span id="progressType"></span>
  </div>

  <div class="flashcard-container" id="flashcardContainer">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-status" id="cardStatus"></div>
      <div class="flashcard-front">
        <div class="word" id="frontWord">word</div>
        <div class="pos" id="frontPos">pos</div>
        <div class="hint">👆 点击查看释义</div>
      </div>
      <div class="flashcard-back">
        <div class="def" id="backDef">definition</div>
        <div class="ex" id="backEx">example</div>
      </div>
    </div>
  </div>

  <div class="action-buttons">
    <button class="btn btn-known" onclick="markWord(true)">✓ 认识</button>
    <button class="btn btn-unknown" onclick="markWord(false)">✗ 不认识</button>
    <button class="btn" onclick="prevCard()">← 上一个</button>
    <button class="btn" onclick="nextCard()">下一个 →</button>
    <button class="btn" onclick="restartStudy()">🔄 重新开始</button>
  </div>
</div>

<div id="completeArea" style="display:none;">
  <div class="box">
    <h3>🎉 本轮学习完成！</h3>
    <div class="stats-grid" id="finalStats"></div>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" onclick="restartStudy()">🔄 再练一轮</button>
      <button class="btn" onclick="backToSelector()">← 返回词表选择</button>
    </div>
  </div>
</div>

<h2>📊 学习统计</h2>
<div class="stats-grid" id="allStats"></div>

<h2>🔄 今日复习（错题生词）</h2>
<div class="box-dashed">
  <p class="muted">标记为"不认识"的单词会自动加入复习列表。</p>
  <div id="reviewList"></div>
  <button class="btn" onclick="startReview()" id="reviewBtn" style="margin-top:12px;">开始复习</button>
</div>

<div class="footer">
  <a href="../index.html">Practice Home</a>
</div>

<script src="../../js/vocab.js"></script>
<script>
(function() {
  'use strict';

  var currentStudy = null;
  var currentType = null;

  function init() {
    renderTypeCards();
    renderAllStats();
    renderReviewList();
  }

  function renderTypeCards() {
    var types = window.Vocab.getTypes();
    var container = document.getElementById('typeCards');
    container.innerHTML = '';
    types.forEach(function(type) {
      var stats = window.Vocab.getStats(type);
      var card = document.createElement('div');
      card.className = 'type-card';
      card.innerHTML = '<div class="type-name">' + window.Vocab.getTypeName(type) + '</div>' +
        '<div class="type-stats">已掌握: ' + stats.known + ' / ' + stats.total + '</div>' +
        '<div class="type-stats">待学习: ' + stats.unknown + '</div>';
      card.onclick = function() { startStudy(type); };
      container.appendChild(card);
    });
  }

  function startStudy(type) {
    currentType = type;
    currentStudy = window.Vocab.startStudy(type);
    if (!currentStudy) return;
    document.getElementById('typeSelector').style.display = 'none';
    document.getElementById('completeArea').style.display = 'none';
    document.getElementById('studyArea').style.display = 'block';
    document.getElementById('progressType').textContent = window.Vocab.getTypeName(type);
    showCard();
  }

  function showCard() {
    var card = currentStudy.current();
    if (!card) {
      showComplete();
      return;
    }
    document.getElementById('frontWord').textContent = card.word;
    document.getElementById('frontPos').textContent = card.pos;
    document.getElementById('backDef').textContent = card.def;
    document.getElementById('backEx').textContent = card.ex;
    var statusEl = document.getElementById('cardStatus');
    if (card.known === 'known') {
      statusEl.textContent = '✓ 已掌握';
      statusEl.style.color = '#111';
    } else if (card.known === 'unknown') {
      statusEl.textContent = '✗ 需复习';
      statusEl.style.color = '#888';
    } else {
      statusEl.textContent = '';
    }
    var total = currentStudy.total();
    var idx = currentStudy.index;
    var pct = Math.round((idx + 1) / total * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = (idx + 1) + ' / ' + total;
    var flashcard = document.getElementById('flashcard');
    if (flashcard.classList.contains('flipped')) {
      flashcard.classList.remove('flipped');
    }
  }

  window.flipCard = function() {
    var flashcard = document.getElementById('flashcard');
    flashcard.classList.toggle('flipped');
  };

  window.markWord = function(known) {
    if (!currentStudy) return;
    currentStudy.mark(known);
    nextCard();
  };

  window.nextCard = function() {
    if (!currentStudy) return;
    if (currentStudy.complete()) {
      showComplete();
      return;
    }
    currentStudy.next();
    showCard();
  };

  window.prevCard = function() {
    if (!currentStudy) return;
    if (currentStudy.index > 0) {
      currentStudy.prev();
      showCard();
    }
  };

  window.restartStudy = function() {
    if (currentType) {
      startStudy(currentType);
    }
  };

  window.backToSelector = function() {
    document.getElementById('typeSelector').style.display = 'block';
    document.getElementById('studyArea').style.display = 'none';
    document.getElementById('completeArea').style.display = 'none';
    renderTypeCards();
    renderAllStats();
    renderReviewList();
  };

  function showComplete() {
    document.getElementById('studyArea').style.display = 'none';
    document.getElementById('completeArea').style.display = 'block';
    var stats = window.Vocab.getStats(currentType);
    var container = document.getElementById('finalStats');
    container.innerHTML =
      '<div class="stat-item"><div class="stat-value">' + stats.total + '</div><div class="stat-label">总词数</div></div>' +
      '<div class="stat-item"><div class="stat-value">' + stats.known + '</div><div class="stat-label">已掌握</div></div>' +
      '<div class="stat-item"><div class="stat-value">' + stats.unknown + '</div><div class="stat-label">待学习</div></div>';
    renderAllStats();
    renderReviewList();
  }

  function renderAllStats() {
    var container = document.getElementById('allStats');
    container.innerHTML = '';
    var types = window.Vocab.getTypes();
    types.forEach(function(type) {
      var stats = window.Vocab.getStats(type);
      var item = document.createElement('div');
      item.className = 'stat-item';
      item.innerHTML = '<div class="stat-value">' + stats.known + '/' + stats.total + '</div><div class="stat-label">' + window.Vocab.getTypeName(type) + ' 已掌握</div>';
      container.appendChild(item);
    });
  }

  function renderReviewList() {
    var container = document.getElementById('reviewList');
    var list = window.Vocab.getReviewList();
    if (!list.length) {
      container.innerHTML = '<p class="muted">暂无需要复习的单词。继续加油！</p>';
      document.getElementById('reviewBtn').style.display = 'none';
      return;
    }
    container.innerHTML = '';
    list.slice(0, 20).forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = '<span class="review-word">' + item.word + '</span><span class="review-type">' + window.Vocab.getTypeName(item.type) + '</span>';
      container.appendChild(div);
    });
    if (list.length > 20) {
      var more = document.createElement('p');
      more.className = 'muted';
      more.textContent = '... 还有 ' + (list.length - 20) + ' 个单词';
      container.appendChild(more);
    }
    document.getElementById('reviewBtn').style.display = 'inline-block';
  }

  window.startReview = function() {
    var list = window.Vocab.getReviewList();
    if (!list.length) return;
    var type = list[0].type;
    startStudy(type);
  };

  init();

})();
</script>

</body>
</html>

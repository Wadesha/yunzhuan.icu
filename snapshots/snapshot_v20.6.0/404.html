<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | yunzhuan.icu</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 16px 40px;
            background: #f5f5f5;
            color: #333;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #667eea;
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .error-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .search-box {
            margin-bottom: 24px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: white;
            color: #333;
        }
        .search-box input:focus {
            border-color: #667eea;
        }
        .search-kbd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: #aaa;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            font-family: monospace;
            pointer-events: none;
        }
        .quick-links {
            text-align: left;
            margin-top: 28px;
        }
        .quick-links h3 {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .link-grid a {
            display: block;
            padding: 10px 14px;
            background: white;
            border-radius: 6px;
            text-decoration: none;
            color: #555;
            font-size: 0.88rem;
            transition: all 0.15s;
            text-align: left;
        }
        .link-grid a:hover {
            background: #e8eaf6;
            color: #667eea;
        }
        .home-btn {
            display: inline-block;
            padding: 10px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        .home-btn:hover {
            background: #5a67d8;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.8rem;
            color: #999;
        }
        .footer a { color: #999; text-decoration: none; }
        .footer a:hover { color: #667eea; }
        @media (max-width: 480px) {
            .error-code { font-size: 4.5rem; }
            .link-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist or has been moved.<br>你要找的页面不存在或已被移动。</p>

    <a href="index.html" class="home-btn">&larr; Back to Home</a>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search the site 搜索网站..." autocomplete="off">
        <span class="search-kbd">/</span>
    </div>

    <div class="quick-links">
        <h3>Popular Pages 热门页面</h3>
        <div class="link-grid">
            <a href="index.html">Majors 专业导航</a>
            <a href="schools/index.html">Schools 学校</a>
            <a href="tests/index.html">Tests 标化考试</a>
            <a href="essays/index.html">Essays 文书</a>
            <a href="rankings.html">Rankings 排名</a>
            <a href="guides/index.html">Guides 指南</a>
            <a href="search.html">Search 全站搜索</a>
            <a href="contact.html">Contact 联系我们</a>
        </div>
    </div>

    <p class="footer">© 2026 yunzhuan.icu &nbsp;|&nbsp; Version v18.10.0</p>

<script>
(function() {
    const input = document.getElementById('searchInput');

    // Focus search on load
    setTimeout(() => input.focus(), 200);

    // Redirect to search page on Enter
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const q = input.value.trim();
            if (q) {
                window.location.href = 'search.html?q=' + encodeURIComponent(q);
            } else {
                window.location.href = 'search.html';
            }
        }
    });

    // Global shortcut: / or Ctrl+K
    document.addEventListener('keydown', function(e) {
        const tag = (e.target.tagName || '').toLowerCase();
        const isTyping = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            input.focus();
            input.select();
            return;
        }

        if (e.key === '/' && !isTyping && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            input.focus();
            input.select();
        }
    });
})();
</script>
<script src="./js/back-to-top.js"></script>
</body>
</html>
